[package]
name = "ghost-nexora-manager"
version = "0.1.0"
description = "Official Ghost Nexora Bot desktop manager"
authors = ["Ghost Developer / Nexora"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ghost_nexora_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
