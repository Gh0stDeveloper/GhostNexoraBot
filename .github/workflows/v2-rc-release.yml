name: V2 Release Candidate

on:
  push:
    branches:
      - 'feat/v2-phase-8-production-release'
    paths:
      - '.github/workflows/v2-rc-release.yml'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/v2-phase8-*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghost-nexora-v2-rc-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: '2.0.0'

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Recheck Phase 8 release invariants
        run: npm run v2:release-gate
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > ghost-nexora-bot-${RELEASE_VERSION}-rc.cdx.json
      - name: Candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "release_kind=release-candidate"
            echo "version=${RELEASE_VERSION}"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "signing=ephemeral-runner-only"
            echo "production_identity=false"
          } > ghost-nexora-${RELEASE_VERSION}-rc-metadata.txt
          sha256sum \
            ghost-nexora-bot-${RELEASE_VERSION}-rc.cdx.json \
            ghost-nexora-${RELEASE_VERSION}-rc-metadata.txt \
            > ghost-nexora-${RELEASE_VERSION}-rc-metadata.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-rc-metadata
          path: |
            ghost-nexora-bot-${{ env.RELEASE_VERSION }}-rc.cdx.json
            ghost-nexora-${{ env.RELEASE_VERSION }}-rc-metadata.txt
            ghost-nexora-${{ env.RELEASE_VERSION }}-rc-metadata.sha256
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Generate ephemeral Android RC keystore
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 20)"
          alias='ghost-nexora-rc'
          keystore="$RUNNER_TEMP/ghost-nexora-rc.jks"
          echo "::add-mask::$password"
          keytool -genkeypair \
            -keystore "$keystore" \
            -storepass "$password" \
            -keypass "$password" \
            -alias "$alias" \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 7 \
            -dname 'CN=Ghost Nexora Bot RC,O=Ghost Developer,C=MX'
          keytool -exportcert -rfc \
            -keystore "$keystore" \
            -storepass "$password" \
            -alias "$alias" \
            > android-rc-signing-cert.pem
          echo "GHOST_NEXORA_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "GHOST_NEXORA_ANDROID_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "GHOST_NEXORA_ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "GHOST_NEXORA_ANDROID_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Android lint and tests
        run: gradle -p apps/android lintDebug testDebugUnitTest
      - name: Build signed Android RC
        run: gradle -p apps/android assembleRelease
      - name: Verify and package Android RC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc-android
          apk="$(find apps/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "rc-android/GhostNexoraManager-${RELEASE_VERSION}-rc.apk"
          cp android-rc-signing-cert.pem rc-android/
          keytool -printcert -file android-rc-signing-cert.pem > rc-android/android-rc-signing-cert.txt
          (
            cd rc-android
            sha256sum GhostNexoraManager-${RELEASE_VERSION}-rc.apk android-rc-signing-cert.pem > android-rc-sha256.txt
          )
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-rc-android
          path: rc-android/*
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf gnupg
      - run: npm install
      - run: npm run tauri:check --workspace=@ghostnexora/desktop
      - name: Build Linux RC bundles
        run: npm run tauri:build --workspace=@ghostnexora/desktop -- --bundles deb,appimage
      - name: Generate ephemeral GPG key and sign Linux RC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc-linux "$RUNNER_TEMP/gnupg"
          chmod 0700 "$RUNNER_TEMP/gnupg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          cat > "$RUNNER_TEMP/gpg-batch" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 3072
          Key-Usage: sign
          Name-Real: Ghost Nexora Bot RC
          Name-Email: rc-signing@ghostnexora.invalid
          Expire-Date: 1d
          %commit
          EOF
          gpg --batch --generate-key "$RUNNER_TEMP/gpg-batch"
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')"
          test -n "$fingerprint"
          find apps/desktop/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} rc-linux/ \;
          test "$(find rc-linux -maxdepth 1 -type f | wc -l)" -ge 2
          (
            cd rc-linux
            sha256sum *.deb *.AppImage > linux-rc-sha256.txt
          )
          gpg --batch --yes --armor --local-user "$fingerprint" --detach-sign rc-linux/linux-rc-sha256.txt
          gpg --batch --verify rc-linux/linux-rc-sha256.txt.asc rc-linux/linux-rc-sha256.txt
          gpg --batch --armor --export "$fingerprint" > rc-linux/linux-rc-signing-public-key.asc
          printf '%s\n' "$fingerprint" > rc-linux/linux-rc-signing-fingerprint.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-rc-linux
          path: rc-linux/*
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri:check --workspace=@ghostnexora/desktop
      - name: Build Windows RC installer
        run: npm run tauri:build --workspace=@ghostnexora/desktop -- --bundles nsis
      - name: Generate ephemeral Windows certificate, sign and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path rc-windows | Out-Null
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Ghost Nexora Bot RC $env:GITHUB_RUN_NUMBER" `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddDays(7)
          $publicCert = Join-Path $env:RUNNER_TEMP 'ghost-nexora-rc.cer'
          Export-Certificate -Cert $cert -FilePath $publicCert | Out-Null
          Import-Certificate -FilePath $publicCert -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          $installer = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          $signed = Set-AuthenticodeSignature -FilePath $installer.FullName -Certificate $cert -HashAlgorithm SHA256
          if ($signed.Status -ne 'Valid') { throw "Signing failed: $($signed.Status) $($signed.StatusMessage)" }
          $verify = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($verify.Status -ne 'Valid') { throw "Verification failed: $($verify.Status) $($verify.StatusMessage)" }
          $out = 'rc-windows/GhostNexoraManager-2.0.0-rc-setup.exe'
          Copy-Item $installer.FullName $out
          Copy-Item $publicCert 'rc-windows/windows-rc-signing-public.cer'
          $verify | Format-List * | Out-File 'rc-windows/windows-rc-signature.txt'
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $out -Leaf)" | Out-File 'rc-windows/windows-rc-sha256.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-rc-windows
          path: rc-windows/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs:
      - metadata
      - android
      - linux
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ghost-nexora-rc-*
          path: release-assets
          merge-multiple: true
      - name: Create visible GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}-rc.${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<EOF
          # Ghost Nexora Bot ${tag}

          Phase 8 release candidate built from commit \`${GITHUB_SHA}\` on branch \`${GITHUB_REF_NAME}\`.

          This is a **prerelease**, not the final production v2.0.0 release and it does not merge anything into \`main\`.

          ## Included

          - Android release APK, signed and verified with an ephemeral runner-only JKS.
          - Windows NSIS installer, signed and verified with an ephemeral self-signed code-signing certificate.
          - Linux DEB/AppImage with SHA-256 manifest and verified detached GPG signature.
          - Public signing certificates/keys for verification.
          - CycloneDX SBOM and candidate metadata.

          ## Important signing boundary

          Private RC signing keys are generated inside GitHub-hosted runners and destroyed when the jobs end. They are never committed or attached to this release. Therefore this candidate proves the complete build/sign/verification pipeline but does **not** establish the permanent production signing identity.

          Final \`v2.0.0\` remains gated by permanent protected signing secrets, staging rollback evidence and the real >=72-hour soak described in \`docs/v2/PHASE_8.md\`.
          EOF
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ghost Nexora Bot ${tag}" \
            --notes-file release-notes.md \
            --prerelease
