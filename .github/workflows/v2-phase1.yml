name: V2 Phase 1

on:
  pull_request:
    paths:
      - 'apps/bot/**'
      - 'packages/**'
      - 'scripts/whatsapp-adapter-v2-smoke.mjs'
      - 'scripts/v2-phase1-command-regression.mjs'
      - 'scripts/v2-baseline-report.mjs'
      - 'scripts/v2-inventory-worker.mjs'
      - 'docs/v2/**'
      - 'package.json'
      - '.github/workflows/v2-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whatsapp-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Phase 0 contracts remain valid
        run: npm run v2:contracts

      - name: WhatsApp adapter contract smoke
        run: npm run v2:whatsapp-adapter

      - name: Termux Lite build through shared contracts
        run: npm run build:termux --workspace=@ghostnexora/bot

      - name: Termux Lite profile smoke
        run: node scripts/termux-lite-smoke.mjs

      - name: Generate current command inventory
        run: node scripts/v2-baseline-report.mjs --output=v2-phase1-inventory.json

      - name: Verify frozen V1 command/provider parity
        run: node scripts/v2-phase1-command-regression.mjs --input=v2-phase1-inventory.json

      - name: Upload Phase 1 inventory
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase1-inventory
          path: v2-phase1-inventory.json
          retention-days: 30
