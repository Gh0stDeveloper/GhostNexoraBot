name: Android Native Lite

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/bot/src/mobile-lite.ts'
      - 'apps/bot/src/commands/mobile-lite.ts'
      - 'apps/bot/tsconfig.mobile.json'
      - 'apps/bot/package.json'
      - 'scripts/android/**'
      - 'scripts/android-native-lite-audit.mjs'
      - 'scripts/mobile-lite-runtime-smoke.mjs'
      - '.github/workflows/android-native-lite.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-lite:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install dependencies
        run: npm install
      - name: Build mobile-lite
        run: npm run build:mobile --workspace=@ghostnexora/bot
      - name: JavaScript syntax smoke
        run: find apps/bot/dist-mobile -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Runtime capability smoke
        run: node scripts/mobile-lite-runtime-smoke.mjs
      - name: Native Lite anti-regression audit
        run: node scripts/android-native-lite-audit.mjs
      - name: Build autonomous runtime pack
        run: bash scripts/android/build-mobile-runtime-pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-mobile-lite-runtime
          path: artifacts/mobile-runtime/**
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-mobile-lite-js
          path: apps/bot/dist-mobile/**
          if-no-files-found: error
          retention-days: 14

  android:
    needs: [mobile-lite, embedded-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK / NDK / CMake
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'platform-tools' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Download arm64 Embedded Node
        uses: actions/download-artifact@v4
        with:
          name: nexora-embedded-node-arm64-v8a
          path: apps/android/app/src/main/node-runtime/arm64-v8a
      - name: Download x86_64 Embedded Node
        uses: actions/download-artifact@v4
        with:
          name: nexora-embedded-node-x86_64
          path: apps/android/app/src/main/node-runtime/x86_64
      - name: Download Mobile Lite runtime
        uses: actions/download-artifact@v4
        with:
          name: ghost-nexora-mobile-lite-runtime
          path: apps/android/app/src/main/assets/runtime
      - name: Verify staged autonomous runtime
        run: |
          test -f apps/android/app/src/main/node-runtime/arm64-v8a/libnode.so
          test -f apps/android/app/src/main/node-runtime/arm64-v8a/include/node/node.h
          test -f apps/android/app/src/main/node-runtime/x86_64/libnode.so
          test -f apps/android/app/src/main/node-runtime/x86_64/include/node/node.h
          test -f apps/android/app/src/main/assets/runtime/mobile-lite-runtime.zip
          test -f apps/android/app/src/main/assets/runtime/mobile-lite-runtime.zip.sha256
          (
            cd apps/android/app/src/main/assets/runtime
            sha256sum -c mobile-lite-runtime.zip.sha256
          )
      - name: Native Lite anti-regression audit
        run: node scripts/android-native-lite-audit.mjs
      - name: Android lint and unit tests
        run: gradle -p apps/android lintDebug testDebugUnitTest
      - name: Build debug and release APKs
        run: gradle -p apps/android assembleDebug assembleRelease
      - name: Verify autonomous payload inside APK
        run: |
          APK="$(find apps/android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libnode.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libnexora_node_bridge.so'
          unzip -l "$APK" | grep -F 'lib/x86_64/libnode.so'
          unzip -l "$APK" | grep -F 'lib/x86_64/libnexora_node_bridge.so'
          unzip -l "$APK" | grep -F 'assets/runtime/mobile-lite-runtime.zip'
          unzip -l "$APK" | grep -F 'assets/runtime/mobile-lite-runtime.zip.sha256'
      - name: APK checksums
        run: find apps/android/app/build/outputs/apk -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum | tee android-native-lite-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-android-native-lite
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/release/*.apk
            android-native-lite-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

  embedded-node:
    name: Embedded Node (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      NODE_VERSION: v24.21.0
      ANDROID_API: '33'
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - name: Restore reusable Embedded Node
        id: embedded-node-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/embedded-node/${{ matrix.abi }}
          key: nexora-embedded-node-v1-${{ runner.os }}-${{ matrix.abi }}-node-${{ env.NODE_VERSION }}-api-${{ env.ANDROID_API }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/android/build-embedded-node.sh', 'scripts/android/patches/node-v24.21.0/**') }}

      - name: Report Embedded Node cache hit
        if: steps.embedded-node-cache.outputs.cache-hit == 'true'
        run: |
          echo "Using cached Nexora Embedded Node for ${{ matrix.abi }}"
          cat "artifacts/embedded-node/${{ matrix.abi }}/node-version.txt"
          cat "artifacts/embedded-node/${{ matrix.abi }}/android-api.txt"
          cat "artifacts/embedded-node/${{ matrix.abi }}/abi.txt"

      - name: Install pinned NDK
        if: steps.embedded-node-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Build Nexora Embedded Node
        if: steps.embedded-node-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          JOBS: '4'
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          bash scripts/android/build-embedded-node.sh

      - name: Verify shared object
        run: |
          test -f "artifacts/embedded-node/${{ matrix.abi }}/libnode.so"
          test -f "artifacts/embedded-node/${{ matrix.abi }}/include/node/node.h"
          file "artifacts/embedded-node/${{ matrix.abi }}/libnode.so"
          readelf -h "artifacts/embedded-node/${{ matrix.abi }}/libnode.so"
          (
            cd "artifacts/embedded-node/${{ matrix.abi }}"
            sha256sum -c libnode.so.sha256
          )

      - name: Save reusable Embedded Node
        if: steps.embedded-node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/embedded-node/${{ matrix.abi }}
          key: ${{ steps.embedded-node-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: nexora-embedded-node-${{ matrix.abi }}
          path: artifacts/embedded-node/${{ matrix.abi }}/**
          if-no-files-found: error
          retention-days: 14
