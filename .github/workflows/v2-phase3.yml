name: V2 Phase 3

on:
  pull_request:
    paths:
      - 'apps/bot/**'
      - 'packages/**'
      - 'scripts/v2-phase3-provider-smoke.mjs'
      - 'scripts/v2-phase3-provider-http-smoke.mjs'
      - 'scripts/v2-phase3-provider-lease-smoke.mjs'
      - 'scripts/v2-phase3-live-provider-audit.mjs'
      - 'scripts/v2-phase3-live-provider-gate.mjs'
      - 'scripts/v2-phase3-command-regression.mjs'
      - 'scripts/v2-baseline-report.mjs'
      - 'docs/v2/**'
      - '.env.example'
      - 'package.json'
      - '.github/workflows/v2-phase3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install current yt-dlp for live fallback probes
        run: python3 -m pip install --break-system-packages --upgrade yt-dlp

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Phase 0 contracts remain valid
        run: npm run v2:contracts

      - name: Phase 1 WhatsApp adapter remains valid
        run: npm run v2:whatsapp-adapter

      - name: Phase 2 UI compatibility remains valid
        run: npm run v2:ui-compat

      - name: Phase 3 provider contracts, redirect transport and lease smokes
        run: npm run v2:providers

      - name: Termux Lite build
        run: npm run build:termux --workspace=@ghostnexora/bot

      - name: Termux Lite profile smoke
        run: node scripts/termux-lite-smoke.mjs

      - name: Generate current command inventory
        run: node scripts/v2-baseline-report.mjs --output=v2-phase3-inventory.json

      - name: Verify frozen V1 surface plus approved Phase 3 delta
        run: node scripts/v2-phase3-command-regression.mjs --input=v2-phase3-inventory.json

      - name: Live endpoint and signed-download contract gate
        run: >-
          node scripts/v2-phase3-live-provider-gate.mjs
          --allow-known-antibot-blocks
          --output=artifacts/v2-phase3-live-provider-audit.json
          --gate-output=artifacts/v2-phase3-live-provider-gate.json

      - name: Upload Phase 3 live audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase3-live-provider-audit
          path: |
            artifacts/v2-phase3-live-provider-audit.json
            artifacts/v2-phase3-live-provider-gate.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Phase 3 command inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase3-inventory
          path: v2-phase3-inventory.json
          if-no-files-found: warn
          retention-days: 30
