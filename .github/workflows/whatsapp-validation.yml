name: WhatsApp Validation

on:
  pull_request:
    paths:
      - 'apps/bot/**'
      - 'packages/**'
      - 'scripts/whatsapp-adapter-v2-smoke.mjs'
      - 'scripts/command-regression.mjs'
      - 'scripts/command-surface-regression.mjs'
      - 'scripts/v2-baseline-report.mjs'
      - 'scripts/v2-inventory-worker.mjs'
      - 'docs/v2/**'
      - 'package.json'
      - '.github/workflows/whatsapp-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  whatsapp-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Contracts contracts remain valid
        run: npm run v2:contracts

      - name: WhatsApp adapter contract smoke
        run: npm run v2:whatsapp-adapter


      - name: Termux Lite build through shared contracts
        run: npm run build:termux --workspace=@ghostnexora/bot

      - name: Termux Lite profile smoke
        run: node scripts/termux-lite-smoke.mjs

      - name: Generate current command inventory
        run: node scripts/v2-baseline-report.mjs --output=whatsapp-inventory.json

      - name: Verify frozen V1 surface plus approved Providers delta
        run: node scripts/command-surface-regression.mjs --input=whatsapp-inventory.json

      - name: Upload WhatsApp inventory
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-inventory
          path: whatsapp-inventory.json
          retention-days: 30
