name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Private chat silent-block policy smoke
        run: node scripts/private-chat-policy-smoke.mjs

      - name: Group inactive member policy smoke
        run: node scripts/group-inactivity-smoke.mjs

      - name: V18 subbot, Lottie, inactivity and economy UI smoke
        run: node scripts/v18-runtime-smoke.mjs

      - name: Operations dashboard telemetry smoke
        run: node scripts/ops-dashboard-smoke.mjs

      - name: Spanish/English i18n isolation smoke
        run: node scripts/i18n-smoke.mjs

      - name: User-facing i18n audit report
        run: node scripts/i18n-user-facing-audit.mjs

      - name: Upload i18n audit
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: i18n-user-facing-audit
          path: i18n-user-facing-audit.json
          retention-days: 3

      - name: Upload bot source snapshot
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: i18n-source-snapshot
          path: |
            apps/bot/src
            apps/bot/package.json
            apps/bot/tsconfig.json
            package.json
            scripts/i18n-smoke.mjs
            scripts/private-chat-policy-smoke.mjs
            scripts/group-inactivity-smoke.mjs
            scripts/v18-runtime-smoke.mjs
            scripts/ops-dashboard-smoke.mjs
            scripts/v5-smoke.mjs
            scripts/youtube-select-smoke.mjs
            scripts/bank-v10-smoke.mjs
          retention-days: 3

      - name: WhatsApp offline browser resilience smoke
        run: node scripts/nav-offline-smoke.mjs

      - name: Arcade V16 offline games smoke
        run: node scripts/arcade-v16-smoke.mjs

      - name: Canonical V15 download routing smoke
        run: node scripts/download-routing-v15-smoke.mjs

      - name: Optional Ollama command registry smoke
        run: node scripts/llm-optional-smoke.mjs

      - name: Optional Web command registry smoke
        run: node scripts/web-optional-smoke.mjs

      - name: Subbot recovery and shared entitlement smoke
        run: node scripts/subbot-recovery-smoke.mjs

      - name: Atomic wallet multi-process smoke
        run: node scripts/wallet-atomic-smoke.mjs

      - name: MainBot session repair dry-run
        run: |
          cp .env.example .env
          npm run session:repair -- --check
          rm -f .env

      - name: ghostnexorabot global CLI smoke
        run: |
          sudo "$(command -v node)" scripts/install-cli.mjs
          command -v ghostnexorabot
          ghostnexorabot help

      - name: Termux Lite build
        run: npm run build:termux --workspace=@ghostnexora/bot

      - name: Termux Lite profile smoke
        run: node scripts/termux-lite-smoke.mjs

      - name: Local waifu assets smoke
        run: node scripts/waifu-assets-smoke.mjs

      - name: Waifu variant-first style catalog smoke
        run: node scripts/waifu-style-catalog-smoke.mjs

      - name: Global wallet migration smoke
        run: node scripts/economy-global-smoke.mjs

      - name: Banking V10 smoke
        run: node scripts/bank-v10-smoke.mjs

      - name: V4 persistence smoke
        run: node scripts/v4-smoke.mjs

      - name: V5 compatibility smoke
        run: node scripts/v5-smoke.mjs

      - name: YouTube select-first smoke
        run: node scripts/youtube-select-smoke.mjs

      - name: Long Ollama response and checkers UI smoke
        run: node scripts/llm-long-response-ui-smoke.mjs

      - name: Mini-LLM modular smoke
        run: npx tsx apps/bot/src/llm/smoke.ts

      - name: Validate shell scripts
        run: bash -n scripts/install.sh scripts/update.sh scripts/install-ollama.sh scripts/install-llm-worker-service.sh scripts/install-termux.sh scripts/update-termux.sh scripts/repair-session.sh scripts/termux/ghostnexora

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/install-windows.ps1',
            'scripts/windows/ghostnexora.ps1'
          )
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell syntax errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              $failed = $true
            } else {
              Write-Host "OK: $file"
            }
          }
          if ($failed) { exit 1 }

      - name: Windows manager help smoke
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/ghostnexora.ps1 help

      - name: MainBot session repair Windows dry-run
        shell: powershell
        run: |
          Copy-Item .env.example .env
          npm.cmd run session:repair -- --check
          Remove-Item .env -Force

      - name: ghostnexorabot Windows CLI smoke
        shell: pwsh
        run: |
          node scripts/install-cli.mjs
          $cli = Join-Path $env:LOCALAPPDATA 'GhostNexora\bin\ghostnexorabot.cmd'
          if (-not (Test-Path $cli)) { throw "No se creó $cli" }
          & $cli help