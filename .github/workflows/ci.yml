name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Optional Ollama command registry smoke
        run: node scripts/llm-optional-smoke.mjs

      - name: Optional Web command registry smoke
        run: node scripts/web-optional-smoke.mjs

      - name: Termux Lite build
        run: npm run build:termux --workspace=@ghostnexora/bot

      - name: Termux Lite profile smoke
        run: node scripts/termux-lite-smoke.mjs

      - name: Local waifu assets smoke
        run: node scripts/waifu-assets-smoke.mjs

      - name: Global wallet migration smoke
        run: node scripts/economy-global-smoke.mjs

      - name: Banking V10 smoke
        run: node scripts/bank-v10-smoke.mjs

      - name: V4 persistence smoke
        run: node scripts/v4-smoke.mjs

      - name: V5 compatibility smoke
        run: node scripts/v5-smoke.mjs

      - name: YouTube select-first smoke
        run: node scripts/youtube-select-smoke.mjs

      - name: Long Ollama response and checkers UI smoke
        run: node scripts/llm-long-response-ui-smoke.mjs

      - name: Mini-LLM modular smoke
        run: npx tsx apps/bot/src/llm/smoke.ts

      - name: Validate shell scripts
        run: bash -n scripts/install.sh scripts/update.sh scripts/install-ollama.sh scripts/install-llm-worker-service.sh scripts/install-termux.sh scripts/update-termux.sh scripts/termux/ghostnexora

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/install-windows.ps1',
            'scripts/windows/ghostnexora.ps1'
          )
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell syntax errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              $failed = $true
            } else {
              Write-Host "OK: $file"
            }
          }
          if ($failed) { exit 1 }

      - name: Windows manager help smoke
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/ghostnexora.ps1 help
