name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: V4 persistence smoke
        run: node scripts/v4-smoke.mjs

      - name: V5 compatibility smoke
        run: node scripts/v5-smoke.mjs

      - name: Mini-LLM modular smoke
        run: npx tsx apps/bot/src/llm/smoke.ts

      - name: Validate shell scripts
        run: bash -n scripts/install.sh scripts/update.sh
