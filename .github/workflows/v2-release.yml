name: V2 Production Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Exact candidate branch/tag/SHA that completed soak'
        required: true
        default: 'feat/v2-phase-8-production-release'
        type: string
      release_tag:
        description: 'Release tag to publish after all gates pass'
        required: true
        default: 'v2.0.0'
        type: string
      soak_started_at:
        description: 'ISO-8601 UTC timestamp when the >=72h soak started'
        required: true
        type: string
      publish_release:
        description: 'Create/publish the GitHub release after signed artifacts pass'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ghost-nexora-v2-production-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: '2.0.0'

jobs:
  production-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GHOST_NEXORA_SOAK_STARTED_AT: ${{ inputs.soak_started_at }}
      GHOST_NEXORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.GHOST_NEXORA_ANDROID_KEYSTORE_BASE64 }}
      GHOST_NEXORA_ANDROID_KEY_ALIAS: ${{ secrets.GHOST_NEXORA_ANDROID_KEY_ALIAS }}
      GHOST_NEXORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GHOST_NEXORA_ANDROID_KEYSTORE_PASSWORD }}
      GHOST_NEXORA_ANDROID_KEY_PASSWORD: ${{ secrets.GHOST_NEXORA_ANDROID_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_SIGNING_KEY_ID: ${{ secrets.GPG_SIGNING_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Enforce exact release identity, secrets and 72h soak
        run: npm run v2:release-gate -- --mode=release
      - name: Reject a release tag pointing at another commit
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ inputs.release_tag }}"
          [[ "$expected" == "v${RELEASE_VERSION}" ]] || { echo "Only v${RELEASE_VERSION} may be published by this workflow." >&2; exit 1; }
          git fetch --tags origin
          if git show-ref --tags --verify --quiet "refs/tags/$expected"; then
            tag_sha="$(git rev-list -n1 "$expected")"
            head_sha="$(git rev-parse HEAD)"
            [[ "$tag_sha" == "$head_sha" ]] || { echo "Existing tag $expected points to $tag_sha, not $head_sha" >&2; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v2-production-gate
          path: v2-phase8-release-gate.json
          if-no-files-found: error
          retention-days: 90

  sbom:
    needs: production-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > ghost-nexora-bot-2.0.0.cdx.json
      - name: Hash SBOM
        run: sha256sum ghost-nexora-bot-2.0.0.cdx.json > ghost-nexora-bot-2.0.0.cdx.json.sha256
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ghost-nexora-bot-2.0.0.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-v2-sbom
          path: |
            ghost-nexora-bot-2.0.0.cdx.json
            ghost-nexora-bot-2.0.0.cdx.json.sha256
          if-no-files-found: error
          retention-days: 90

  android:
    needs: production-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GHOST_NEXORA_SOURCE_REF: ${{ inputs.release_ref }}
      GHOST_NEXORA_ANDROID_KEY_ALIAS: ${{ secrets.GHOST_NEXORA_ANDROID_KEY_ALIAS }}
      GHOST_NEXORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GHOST_NEXORA_ANDROID_KEYSTORE_PASSWORD }}
      GHOST_NEXORA_ANDROID_KEY_PASSWORD: ${{ secrets.GHOST_NEXORA_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Materialize release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GHOST_NEXORA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ghost-nexora-release.jks"
          chmod 0600 "$RUNNER_TEMP/ghost-nexora-release.jks"
          echo "GHOST_NEXORA_ANDROID_KEYSTORE=$RUNNER_TEMP/ghost-nexora-release.jks" >> "$GITHUB_ENV"
      - name: Lint and tests
        run: gradle -p apps/android lintDebug testDebugUnitTest
      - name: Build signed release APK
        run: gradle -p apps/android assembleRelease
      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk="$(find apps/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > android-SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: apps/android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-manager-android-2.0.0
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            android-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  linux:
    needs: production-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GPG_SIGNING_KEY_ID: ${{ secrets.GPG_SIGNING_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npm run tauri:check --workspace=@ghostnexora/desktop
      - name: Build Linux bundles
        run: npm run tauri:build --workspace=@ghostnexora/desktop -- --bundles deb,appimage
      - name: Import release GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Generate and sign checksums
        run: |
          set -euo pipefail
          find apps/desktop/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -print0 | sort -z | xargs -0 sha256sum > linux-SHA256SUMS.txt
          gpg --batch --yes --armor --local-user "$GPG_SIGNING_KEY_ID" --detach-sign --output linux-SHA256SUMS.txt.asc linux-SHA256SUMS.txt
          gpg --verify linux-SHA256SUMS.txt.asc linux-SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-manager-linux-2.0.0
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            linux-SHA256SUMS.txt
            linux-SHA256SUMS.txt.asc
          if-no-files-found: error
          retention-days: 90

  windows:
    needs: production-gate
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri:check --workspace=@ghostnexora/desktop
      - name: Build NSIS installer
        run: npm run tauri:build --workspace=@ghostnexora/desktop -- --bundles nsis
      - name: Materialize Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\ghost-nexora-release.pfx", $bytes)
      - name: Sign and verify NSIS installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $installer = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\ghost-nexora-release.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content windows-SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-nexora-manager-windows-2.0.0
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            windows-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    if: ${{ inputs.publish_release }}
    needs: [production-gate, sbom, android, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create tag at the exact candidate commit if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if ! git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag -a "$RELEASE_TAG" "$head_sha" -m "Ghost Nexora Bot $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-artifacts -type f ! -path '*/v2-production-gate/*' | sort)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --title "Ghost Nexora Bot 2.0.0" --notes-file docs/v2/RELEASE_2_0.md --verify-tag
          fi
