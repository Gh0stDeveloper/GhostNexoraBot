name: V2 Phase 5

on:
  pull_request:
    paths:
      - 'apps/bot/**'
      - 'packages/**'
      - 'scripts/v2-phase5-discord-*.mjs'
      - 'scripts/v2-phase4-telegram-smoke.mjs'
      - 'scripts/v2-phase4-telegram-audit.mjs'
      - 'scripts/v2-phase3-command-regression.mjs'
      - 'scripts/v2-baseline-report.mjs'
      - '.env.example'
      - 'package.json'
      - 'docs/v2/**'
      - '.github/workflows/v2-phase5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discord-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Phase 0 contracts remain valid
        run: npm run v2:contracts

      - name: Phase 1 WhatsApp adapter remains valid
        run: npm run v2:whatsapp-adapter

      - name: Phase 2 UI compatibility remains valid
        run: npm run v2:ui-compat

      - name: Phase 3 deterministic providers remain valid
        run: npm run v2:providers

      - name: Phase 4 Telegram remains valid
        run: npm run v2:telegram

      - name: Phase 5 Discord adapter, REST, Gateway and runtime
        run: npm run v2:discord

      - name: Termux Lite build
        run: npm run build:termux --workspace=@ghostnexora/bot

      - name: Termux Lite profile smoke
        run: node scripts/termux-lite-smoke.mjs

      - name: Generate current command inventory
        run: node scripts/v2-baseline-report.mjs --output=v2-phase5-inventory.json

      - name: Verify WhatsApp command surface remains Phase 3 compatible
        run: node scripts/v2-phase3-command-regression.mjs --input=v2-phase5-inventory.json

      - name: Upload Phase 5 command inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase5-inventory
          path: v2-phase5-inventory.json
          if-no-files-found: warn
          retention-days: 30
