name: i18n Validation

on:
  pull_request:
    paths:
      - 'apps/bot/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/i18n-*.mjs'
      - 'scripts/v2-phase6-*.mjs'
      - 'scripts/v2-phase5-discord-*.mjs'
      - 'scripts/v2-phase4-telegram-*.mjs'
      - 'scripts/command-surface-regression.mjs'
      - 'scripts/v2-baseline-report.mjs'
      - 'package.json'
      - 'docs/v2/**'
      - '.github/workflows/v2-phase6.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  multilingual-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Contracts contracts remain valid
        run: npm run v2:contracts

      - name: WhatsApp WhatsApp adapter remains valid
        run: npm run v2:whatsapp-adapter

      - name: WhatsApp UI UI compatibility remains valid
        run: npm run v2:ui-compat

      - name: Providers deterministic providers remain valid
        run: npm run v2:providers

      - name: Telegram Telegram remains valid
        run: npm run v2:telegram

      - name: Discord Discord remains valid
        run: npm run v2:discord



      - name: i18n ES/EN locale isolation and boundary gate
        run: npm run v2:i18n

      - name: Termux Lite build
        run: npm run build:termux --workspace=@ghostnexora/bot

      - name: Termux Lite profile smoke
        run: node scripts/termux-lite-smoke.mjs

      - name: Generate current command inventory
        run: node scripts/v2-baseline-report.mjs --output=i18n-inventory.json

      - name: Verify WhatsApp command surface remains compatible
        run: node scripts/command-surface-regression.mjs --input=i18n-inventory.json

      - name: Upload i18n i18n evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-phase6-i18n
          path: |
            i18n-platform-audit.json
            i18n-user-facing-audit.json
            i18n-inventory.json
          if-no-files-found: warn
          retention-days: 30
