name: Providers Validation

on:
  pull_request:
    paths:
      - 'apps/bot/**'
      - 'packages/**'
      - 'scripts/provider-smoke.mjs'
      - 'scripts/provider-http-smoke.mjs'
      - 'scripts/provider-lease-smoke.mjs'
      - 'scripts/provider-live-audit.mjs'
      - 'scripts/provider-live-gate.mjs'
      - 'scripts/command-surface-regression.mjs'
      - 'scripts/v2-baseline-report.mjs'
      - 'docs/v2/**'
      - '.env.example'
      - 'package.json'
      - '.github/workflows/providers-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verified-providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install current yt-dlp for live fallback probes
        run: python3 -m pip install --break-system-packages --upgrade yt-dlp

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Contracts contracts remain valid
        run: npm run v2:contracts

      - name: WhatsApp WhatsApp adapter remains valid
        run: npm run v2:whatsapp-adapter

      - name: WhatsApp UI UI compatibility remains valid
        run: npm run v2:ui-compat

      - name: Providers provider contracts, redirect transport and lease smokes
        run: npm run v2:providers

      - name: Termux Lite build
        run: npm run build:termux --workspace=@ghostnexora/bot

      - name: Termux Lite profile smoke
        run: node scripts/termux-lite-smoke.mjs

      - name: Generate current command inventory
        run: node scripts/v2-baseline-report.mjs --output=providers-inventory.json

      - name: Verify frozen V1 surface plus approved Providers delta
        run: node scripts/command-surface-regression.mjs --input=providers-inventory.json

      - name: Live endpoint and signed-download contract gate
        run: >-
          node scripts/provider-live-gate.mjs
          --allow-known-antibot-blocks
          --output=artifacts/providers-live-provider-audit.json
          --gate-output=artifacts/providers-live-provider-gate.json

      - name: Upload Providers live audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: providers-live-provider-audit
          path: |
            artifacts/providers-live-provider-audit.json
            artifacts/providers-live-provider-gate.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Providers command inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: providers-inventory
          path: providers-inventory.json
          if-no-files-found: warn
          retention-days: 30
